name: Docs

on:
  push:
    branches: [main]
  pull_request:

jobs:
  markdownlint:
    name: markdownlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Lint Markdown
        run: npx --yes markdownlint-cli2 "**/*.md" "!repos/**" "!.commandcode/**" "!node_modules/**"
