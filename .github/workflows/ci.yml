name: CI

# One workspace, one pipeline (ADR 0016). The former 17 per-repository `ci.yml`
# copies — three of which had already diverged — collapse into this file.
#
# The `plan` job derives the per-crate test matrix from the same layer table
# that `crates/inox-integration/tests/layering.rs` enforces, so a new crate
# cannot end up in the workspace without being built and tested: the layer table
# is checked against the member list, and the matrix is built from the layer
# table. Nothing is listed here by hand.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # Headless integration tests render through Mesa's llvmpipe (software)
  # backend; the runner has no GPU.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy does not link a final binary, but it still runs dependency build
      # scripts, and some of those need pkg-config entries: `libudev-sys`
      # panics when `libudev.pc` is missing. System libraries are therefore
      # required here too, not only in `build` and `test`.
      - uses: ./.github/actions/system-deps
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Runs against the complete dependency graph, which is what the 18
      # per-repository `deny.toml` copies could not do: each saw only its own
      # subgraph.
      - run: cargo deny check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo doc` compiles dependency build scripts as well, so it needs the
      # same system libraries as `clippy` (see that job).
      - uses: ./.github/actions/system-deps
      - run: cargo doc --workspace --no-deps --all-features

  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps
      - run: cargo build --workspace --release --all-features

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Derived from `[workspace.metadata.inox.layers]`, the same table
      # `layering.rs` checks. `--no-deps` keeps this to manifest data: no
      # registry access and nothing to download.
      #
      # `graphics` marks the crates whose manifests declare `smithay`, which is
      # what makes the link steps need the system libraries. Only those entries
      # install them, so the stub crates stay cheap.
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          raw = subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1", "--offline",
          ])
          meta = json.loads(raw)
          layers = meta["metadata"]["inox"]["layers"]
          packages = {p["name"]: p for p in meta["packages"]}

          include = []
          for layer in ("l1", "l2", "l3", "l4", "test"):
              for crate in layers[layer]:
                  deps = packages[crate]["dependencies"]
                  include.append({
                      "crate": crate,
                      "layer": layer,
                      "graphics": any(d["name"] == "smithay" for d in deps),
                  })

          # Fail loudly rather than silently testing nothing, and refuse to run a
          # matrix that does not cover the workspace.
          covered = {entry["crate"] for entry in include}
          members = {p["name"] for p in meta["packages"]}
          if covered != members:
              print(
                  f"layer table does not cover every member: only {sorted(covered)}, "
                  f"missing {sorted(members - covered)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("matrix=" + json.dumps({"include": include}))
          PY

  test:
    name: test (${{ matrix.crate }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Report every crate's result, not just the first failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Only the crates whose manifests declare `smithay` need these; the
      # thirteen stub shards stay cheap. `egl: true` because this job runs
      # tests, including the headless EGL/GLES render tests. The package lists
      # live in one place — see `.github/actions/system-deps/action.yml`.
      - uses: ./.github/actions/system-deps
        if: matrix.graphics
        with:
          egl: "true"
      # One job per crate keeps a failure attributable and keeps the command the
      # same one a developer runs locally: `cargo test -p <crate>`.
      - run: cargo test -p ${{ matrix.crate }} --all-features

  xwayland-e2e:
    name: XWayland end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config libegl1
      # A third-party headless compositor is only good enough for E2 (see
      # docs/quality/acceptance.md §1); E3 needs the Inox compositor.
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      - name: Headless end-to-end test
        run: INOX_XWAYLAND_E2E=1 cargo test -p inox-xwayland --all-features --test headless_x11_mapping -- --nocapture

  m3-e2e:
    name: M3 end-to-end (X11 interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The M3 job drives the real Inox compositor, which renders through
      # EGL/GLES, so it needs the same system libraries as the `test` shards
      # plus the X11 side: `xwayland` (spawned by xwayland-satellite),
      # `x11-apps` for `xeyes` and `x11-utils` for `xwininfo`, and the xcb
      # packages `clang` needs to build xwayland-satellite from source.
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
      - name: X11 and build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config
      # Same tag as the weston job: clipboard support needs >= v0.4, the
      # UTF8_STRING alias and X11->Wayland INCR >= v0.5.1, primary selection
      # >= v0.7 and Wayland->X11 INCR >= v0.8 (see ADR 0017).
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      # A default-feature build must *reject* the test-only option rather than
      # quietly accept it, and every other CI job builds with `--all-features`,
      # so this is the only place that path is ever exercised. It runs before the
      # feature build below because both write the same binary path.
      - name: A default build rejects the test-only option
        run: |
          cargo build -p inox-compositor
          if target/debug/inox-compositor --test-input /tmp/inox-must-be-rejected.sock 2>stderr.txt; then
            echo "a default-feature build accepted --test-input" >&2
            exit 1
          fi
          grep -q "test-input" stderr.txt || {
            echo "the rejection did not name the option:" >&2
            cat stderr.txt >&2
            exit 1
          }
      # The tests drive the compositor and the XWayland service as processes and
      # find them next to their own executable, so both binaries must be built
      # first. `test-input` is the non-default, test-only input injection source
      # the M3 tests need (ADR 0017 decision 7); it is inert without the flag.
      - name: Build the binaries under test
        run: |
          cargo build --workspace --features inox-compositor/test-input
      # E3 evidence (docs/quality/acceptance.md §1): a third-party host is not
      # enough, so this runs the Inox compositor itself with a real X11 client,
      # the satellite bridge and real Wayland clients.
      - name: M3 interop end-to-end
        env:
          INOX_M3_E2E: "1"
          # Also run the `xeyes`/`xwininfo` leg (a real X11 application).
          INOX_M3_E2E_REAL_APPS: "1"
        run: cargo test -p inox-integration --all-features -- --nocapture

  book:
    name: mdbook
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: peaceiris/actions-mdbook@v2
        with:
          mdbook-version: latest
      - run: mdbook build docs/book
