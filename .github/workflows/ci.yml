name: CI

# One workspace, one pipeline (ADR 0016). The former 17 per-repository `ci.yml`
# copies — three of which had already diverged — collapse into this file.
#
# The `plan` job derives the per-crate test matrix from the same layer table
# that `crates/inox-integration/tests/layering.rs` enforces, so a new crate
# cannot end up in the workspace without being built and tested: the layer table
# is checked against the member list, and the matrix is built from the layer
# table. Nothing is listed here by hand.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # Headless integration tests render through Mesa's llvmpipe (software)
  # backend; the runner has no GPU.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.89
      # `qt: "true"` because this is a *whole-workspace* command: it builds
      # every member, `inox-qml-prototype` included, and `cxx-qt`'s build script
      # panics with "Could not find Qt installation" when the Qt 6 dev packages
      # are absent. The same reason applies to `clippy`, `doc` and `build`
      # below — none of them is a per-crate shard.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo check --locked --workspace --all-targets --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy does not link a final binary, but it still runs dependency build
      # scripts, and some of those need pkg-config entries: `libudev-sys`
      # panics when `libudev.pc` is missing. System libraries are therefore
      # required here too, not only in `build` and `test`.
      #
      # `qt: "true"` for the same whole-workspace reason as `msrv`: `cxx-qt`'s
      # build script (which `inox-qml-prototype` depends on) runs under clippy
      # too and aborts without a Qt installation.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Runs against the complete dependency graph, which is what the 18
      # per-repository `deny.toml` copies could not do: each saw only its own
      # subgraph.
      - run: cargo deny check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo doc` compiles dependency build scripts as well, so it needs the
      # same system libraries as `clippy` (see that job) — Qt included, for the
      # same whole-workspace reason.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo doc --workspace --no-deps --all-features

  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release build links the Qt crates for real, and it is a
      # whole-workspace build, so it needs both the Qt 6 packages and the `lld`
      # linker they select (see the `qt` input of the system-deps action).
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo build --workspace --release --all-features

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Derived from `[workspace.metadata.inox.layers]`, the same table
      # `layering.rs` checks. `--no-deps` keeps this to manifest data: no
      # registry access and nothing to download.
      #
      # `graphics` marks the crates whose manifests declare `smithay`, which is
      # what makes the link steps need the system libraries. Only those entries
      # install them, so the stub crates stay cheap.
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          raw = subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1", "--offline",
          ])
          meta = json.loads(raw)
          layers = meta["metadata"]["inox"]["layers"]
          packages = {p["name"]: p for p in meta["packages"]}

          include = []
          for layer in ("l1", "l2", "l3", "l4", "test"):
              for crate in layers[layer]:
                  deps = packages[crate]["dependencies"]
                  include.append({
                      "crate": crate,
                      "layer": layer,
                      "graphics": any(d["name"] == "smithay" for d in deps),
                      # The L3 shell components declare `iced` instead of `smithay`.
                      # They link no system library, but their tests render the real
                      # widget tree, so their shard needs a font installed (see the
                      # `fonts` input of the system-deps action).
                      "ui": any(d["name"] == "iced" for d in deps),
                      # A crate that declares `cxx-qt` builds and links Qt through
                      # pkg-config, so its build-script (and any bridge test) needs
                      # the Qt 6 development packages — the `qt` input of the
                      # system-deps action (ADR 0033/0035). Only registers `qt`
                      # when the crate actually names cxx-qt, so non-Qt crates
                      # stay off the extra system surface.
                      "qt": any(d["name"] == "cxx-qt" for d in deps),
                      # A crate that declares `pam` (through `inox-auth`'s
                      # `server` feature) runs `pam-sys`'s build script, and
                      # that one generates bindings with bindgen, which needs
                      # libclang. Only inox-auth itself declares it —
                      # `inox-greet` takes inox-auth with default features off
                      # and never links libpam — so only that shard pays for
                      # the extra package. See `.github/actions/system-deps`.
                      "pam": any(d["name"] == "pam" for d in deps),
                  })

          # Fail loudly rather than silently testing nothing, and refuse to run a
          # matrix that does not cover the workspace.
          covered = {entry["crate"] for entry in include}
          members = {p["name"] for p in meta["packages"]}
          if covered != members:
              print(
                  f"layer table does not cover every member: only {sorted(covered)}, "
                  f"missing {sorted(members - covered)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("matrix=" + json.dumps({"include": include}))
          PY

  test:
    name: test (${{ matrix.crate }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Report every crate's result, not just the first failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two kinds of shard need system packages: the ones whose manifests
      # declare `smithay` (`graphics`, plus `egl` because they run the headless
      # EGL/GLES render tests), the L3 components whose manifests declare
      # `iced` (`ui`, plus `fonts` because their render tests lay text out
      # through cosmic-text), and the Qt Quick crates that declare `cxx-qt`
      # (`qt`: their build script resolves Qt through pkg-config, so they need
      # the Qt 6 development packages — ADR 0033/0035). Every other shard stays
      # cheap. The package lists live in one place — see
      # `.github/actions/system-deps/action.yml`.
      - uses: ./.github/actions/system-deps
        if: matrix.graphics || matrix.ui || matrix.qt || matrix.pam
        with:
          egl: ${{ matrix.graphics }}
          fonts: ${{ matrix.ui }}
          qt: ${{ matrix.qt }}
      # One job per crate keeps a failure attributable and keeps the command the
      # same one a developer runs locally: `cargo test -p <crate>`.
      #
      # The L3 render tests assert on pixels and, when this variable is set,
      # also write every frame they asserted on as a PNG. Collecting the
      # directory as an artifact is what turns acceptance Q02's "截图覆盖浅/深/
      # 错误态" from a claim into something a reviewer can open. The path is
      # absolute because a test binary runs with its own crate directory as the
      # working directory, so a relative path would scatter files per crate.
      - run: cargo test -p ${{ matrix.crate }} --all-features
        env:
          INOX_SCREENSHOT_DIR: ${{ github.workspace }}/target/inox-screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.ui
        with:
          name: l3-screenshots-${{ matrix.crate }}
          path: target/inox-screenshots
          if-no-files-found: warn

  xwayland-e2e:
    name: XWayland end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config libegl1
      # A third-party headless compositor is only good enough for E2 (see
      # docs/quality/acceptance.md §1); E3 needs the Inox compositor.
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      - name: Headless end-to-end test
        run: INOX_XWAYLAND_E2E=1 cargo test -p inox-xwayland --all-features --test headless_x11_mapping -- --nocapture

  m3-e2e:
    name: M3 end-to-end (X11 interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The M3 job drives the real Inox compositor, which renders through
      # EGL/GLES, so it needs the same system libraries as the `test` shards
      # plus the X11 side: `xwayland` (spawned by xwayland-satellite),
      # `x11-apps` for `xeyes` and `x11-utils` for `xwininfo`, and the xcb
      # packages `clang` needs to build xwayland-satellite from source.
      #
      # `qt: "true"` because "Build the binaries under test" runs
      # `cargo build --workspace`, which builds `inox-qml-prototype` and so
      # needs a Qt installation for `cxx-qt`'s build script.
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          qt: "true"
      - name: X11 and build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config
      # Same tag as the weston job: clipboard support needs >= v0.4, the
      # UTF8_STRING alias and X11->Wayland INCR >= v0.5.1, primary selection
      # >= v0.7 and Wayland->X11 INCR >= v0.8 (see ADR 0017).
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      # A default-feature build must *reject* the test-only option rather than
      # quietly accept it, and every other CI job builds with `--all-features`,
      # so this is the only place that path is ever exercised. It runs before the
      # feature build below because both write the same binary path.
      - name: A default build rejects the test-only option
        run: |
          cargo build -p inox-compositor
          if target/debug/inox-compositor --test-input /tmp/inox-must-be-rejected.sock 2>stderr.txt; then
            echo "a default-feature build accepted --test-input" >&2
            exit 1
          fi
          grep -q "test-input" stderr.txt || {
            echo "the rejection did not name the option:" >&2
            cat stderr.txt >&2
            exit 1
          }
      # The tests drive the compositor and the XWayland service as processes and
      # find them next to their own executable, so both binaries must be built
      # first. `test-input` is the non-default, test-only input injection source
      # the M3 tests need (ADR 0017 decision 7); it is inert without the flag.
      - name: Build the binaries under test
        run: |
          cargo build --workspace --features inox-compositor/test-input
      # E3 evidence (docs/quality/acceptance.md §1): a third-party host is not
      # enough, so this runs the Inox compositor itself with a real X11 client,
      # the satellite bridge and real Wayland clients.
      - name: M3 interop end-to-end
        env:
          INOX_M3_E2E: "1"
          # Also run the `xeyes`/`xwininfo` leg (a real X11 application).
          INOX_M3_E2E_REAL_APPS: "1"
        run: cargo test -p inox-integration --all-features -- --nocapture

  session-e2e:
    name: L4 headless session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          fonts: "true"
      - name: Build the real session components
        run: cargo build -p inox-compositor -p inox-session -p inox-shell -p inox-panel -p inox-wallpaper -p inox-notifications -p inox-idle -p inox-lock
      # `--test headless` is the ADR 0021 shutdown budget; `--test session_lock` is
      # the E3 half of acceptance S02 — the same session, with the session's own
      # token delivered to a real trusted lock client, taking the real session lock
      # on the real compositor and still logging out inside that budget.
      - name: Verify startup, the session lock and bounded logout on Inox
        env:
          INOX_SESSION_E2E_BIN_DIR: ${{ github.workspace }}/target/debug
        run: dbus-run-session -- cargo test -p inox-session --test headless --test session_lock -- --nocapture

  input-method-e2e:
    name: Fcitx5 Chinese input on Inox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          fonts: "true"
      - name: Install the external test input method
        run: sudo apt-get install -y --no-install-recommends fcitx5 fcitx5-pinyin dbus-daemon
      - name: Verify real pinyin preedit and Chinese commit
        env:
          INOX_FCITX5_E2E: "1"
        run: dbus-run-session -- cargo test -p inox-compositor --all-features --test input_method -- --nocapture

  license-audit:
    # ADR 0034 / ADR 0033: cargo-deny only sees the Cargo dependency graph and
    # cannot audit the system Qt `.so` the runtime links. After the Qt-quick
    # migration the project is LGPLv3 and must never pull GPL-only Qt modules
    # (Qt Wayland Compositor, Qt Virtual Keyboard, Qt QML Compiler — see
    # ADR 0033 §"Qt 许可的客观事实"). This job installs the exact system
    # packages the shell links, then asserts (a) the apt-provided Qt modules are
    # present for the build and (b) at runtime `ldd` resolves only the declared
    # Qt modules and none of the forbidden GPL-only ones.
    name: license-audit (system Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system Qt (LGPL route, ADR 0033)
        run: |
          sudo apt-get update
          # Same QML module names as `.github/actions/system-deps`: Ubuntu
          # ships `qml6-module-qtquick*` in noble, and `qml6-module-quick` /
          # `qml6-module-quick-window` do not exist there (an install of a
          # nonexistent name aborts apt with exit 100).
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtquick-controls \
            libqt6waylandclient6 qt6-wayland-dev
          # GPL-only modules must NOT be present: their presence means a build
          # could silently link a GPL dependency into the LGPL project.
          if dpkg -l | grep -E 'qtwayland6-compositor|qt6-virtualkeyboard|qtdeclarative-scxml' >/dev/null; then
            echo "a GPL-only Qt module is installed; refusing" >&2
            dpkg -l | grep -E 'qtwayland6-compositor|qt6-virtualkeyboard'
            exit 1
          fi
      - name: Assert only LGPL Qt modules are linked (ldd)
        run: |
          # Compile a trivial Qt Quick program against the installed LGPL modules
          # and assert its runtime link set stays within the LGPL allow-list.
          set -euo pipefail
          cat > /tmp/linkcheck.cpp <<'CPP'
          #include <QGuiApplication>
          #include <QQmlApplicationEngine>
          int main(int argc, char **argv) {
              QGuiApplication app(argc, argv);
              QQmlApplicationEngine engine;
              return app.exec();
          }
          CPP
          QT_PKG=$(pkg-config --cflags --libs Qt6Gui Qt6Qml Qt6Quick)
          # shellcheck disable=SC2086
          c++ /tmp/linkcheck.cpp -o /tmp/linkcheck $QT_PKG
          ldd /tmp/linkcheck > /tmp/linkcheck.ldd || true
          # Every linked Qt library must be one allowed LGPL module. The list is
          # an allow-list, not a deny-list: a module nobody has vetted fails, so
          # a GPL-only module cannot slip in just by being new. The entries are
          # the LGPLv3 Qt 6 modules that a `QGuiApplication` +
          # `QQmlApplicationEngine` program pulls in — the core four plus the
          # transitively-linked Qml runtime, network, D-Bus and OpenGL helpers.
          # `Qt6QmlCompiler` is deliberately absent: Qt's QML compiler is
          # GPL-only (ADR 0033 §Qt 许可的客观事实), so linking it must fail here.
          #
          # `sed` strips the `.so` suffix so the case labels below are module
          # names; keeping the suffix in one place is what let the previous
          # revision compare `libQt6Core.so` against a `libQt6Core` label and
          # reject every module, including the allowed ones.
          grep -oE 'libQt6[A-Za-z]+\.so' /tmp/linkcheck.ldd \
            | sed -E 's/\.so$//' | sort -u > /tmp/linkcheck.modules
          cat /tmp/linkcheck.modules
          # An empty list would make the loop below pass vacuously, which is the
          # one way this job could report success without auditing anything.
          if [ ! -s /tmp/linkcheck.modules ]; then
            echo "no Qt modules found in ldd output; the link check is not auditing anything" >&2
            exit 1
          fi
          while read -r mod; do
            case "$mod" in
              libQt6Core|libQt6Gui|libQt6Qml|libQt6Quick|\
              libQt6DBus|libQt6Network|libQt6OpenGL|\
              libQt6QmlMeta|libQt6QmlModels|libQt6QmlWorkerScript|\
              libQt6QmlIntegration|libQt6WaylandClient)
                echo "OK (LGPL): $mod"
                ;;
              *)
                echo "FORBIDDEN GPL-only Qt module linked: $mod" >&2
                exit 1
                ;;
            esac
          done < /tmp/linkcheck.modules
          echo "license-audit: only LGPL Qt modules linked"
