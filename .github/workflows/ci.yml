name: CI

# One workspace, one pipeline. The former 17 per-repository `ci.yml`
# copies — three of which had already diverged — collapse into this file.
#
# The `plan` job derives the per-crate test matrix from the same layer table
# that `crates/inox-integration/tests/layering.rs` enforces, so a new crate
# cannot end up in the workspace without being built and tested: the layer table
# is checked against the member list, and the matrix is built from the layer
# table. Nothing is listed here by hand.

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: -D warnings
  # Headless integration tests render through Mesa's llvmpipe (software)
  # backend; the runner has no GPU.
  LIBGL_ALWAYS_SOFTWARE: "1"

jobs:
  fmt:
    name: fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  msrv:
    name: msrv (1.89)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.89.0"
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: msrv-1.89
      # `qt: "true"` because this is a *whole-workspace* command: it builds
      # every member, `inox-qml-prototype` included, and `cxx-qt`'s build script
      # panics with "Could not find Qt installation" when the Qt 6 dev packages
      # are absent. The same reason applies to `clippy`, `doc` and `build`
      # below — none of them is a per-crate shard.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo check --locked --workspace --all-targets --all-features

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Clippy does not link a final binary, but it still runs dependency build
      # scripts, and some of those need pkg-config entries: `libudev-sys`
      # panics when `libudev.pc` is missing. System libraries are therefore
      # required here too, not only in `build` and `test`.
      #
      # `qt: "true"` for the same whole-workspace reason as `msrv`: `cxx-qt`'s
      # build script (which `inox-qml-prototype` depends on) runs under clippy
      # too and aborts without a Qt installation.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # Runs against the complete dependency graph, which is what the 18
      # per-repository `deny.toml` copies could not do: each saw only its own
      # subgraph.
      - run: cargo deny check

  doc:
    name: doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # `cargo doc` compiles dependency build scripts as well, so it needs the
      # same system libraries as `clippy` (see that job) — Qt included, for the
      # same whole-workspace reason.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo doc --workspace --no-deps --all-features

  build:
    name: build (release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release build links the Qt crates for real, and it is a
      # whole-workspace build, so it needs both the Qt 6 packages and the `lld`
      # linker they select (see the `qt` input of the system-deps action).
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      - run: cargo build --workspace --release --all-features

  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      # Derived from `[workspace.metadata.inox.layers]`, the same table
      # `layering.rs` checks. `--no-deps` keeps this to manifest data: no
      # registry access and nothing to download.
      #
      # `graphics` marks the crates whose manifests declare `smithay`, which is
      # what makes the link steps need the system libraries. Only those entries
      # install them, so the stub crates stay cheap.
      - id: matrix
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, subprocess, sys

          raw = subprocess.check_output([
              "cargo", "metadata", "--no-deps", "--format-version", "1", "--offline",
          ])
          meta = json.loads(raw)
          layers = meta["metadata"]["inox"]["layers"]
          packages = {p["name"]: p for p in meta["packages"]}

          include = []
          for layer in ("l1", "l2", "l3", "l4", "test"):
              for crate in layers[layer]:
                  deps = packages[crate]["dependencies"]
                  include.append({
                      "crate": crate,
                      "layer": layer,
                      "graphics": any(d["name"] == "smithay" for d in deps),
                      # A `ui` shard is one of the QML + Qt Quick shell components:
                      # it declares `cxx-qt`, so its build script resolves Qt through
                      # pkg-config and its headless tests load QML modules at runtime.
                      # It needs the Qt packages and fonts (`qt`/`fonts` inputs of the
                      # system-deps action) — the shard also uploads the screenshot
                      # artifacts its tests write.
                      "ui": any(d["name"] == "cxx-qt" for d in deps),
                      # A crate that declares `cxx-qt` builds and links Qt through
                      # pkg-config, so its build-script (and any bridge test) needs
                      # the Qt 6 development packages — the `qt` input of the
                      # system-deps action. Only registers `qt`
                      # when the crate actually names cxx-qt, so non-Qt crates
                      # stay off the extra system surface.
                      "qt": any(d["name"] == "cxx-qt" for d in deps),
                      # A crate that declares `pam` (through `inox-auth`'s
                      # `server` feature) runs `pam-sys`'s build script, and
                      # that one generates bindings with bindgen, which needs
                      # libclang. Only inox-auth itself declares it —
                      # `inox-greet` takes inox-auth with default features off
                      # and never links libpam — so only that shard pays for
                      # the extra package. See `.github/actions/system-deps`.
                      "pam": any(d["name"] == "pam" for d in deps),
                  })

          # Fail loudly rather than silently testing nothing, and refuse to run a
          # matrix that does not cover the workspace.
          covered = {entry["crate"] for entry in include}
          members = {p["name"] for p in meta["packages"]}
          if covered != members:
              print(
                  f"layer table does not cover every member: only {sorted(covered)}, "
                  f"missing {sorted(members - covered)}",
                  file=sys.stderr,
              )
              sys.exit(1)

          print("matrix=" + json.dumps({"include": include}))
          PY

  test:
    name: test (${{ matrix.crate }})
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      # Report every crate's result, not just the first failure.
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Two kinds of shard need system packages: the ones whose manifests
      # declare `smithay` (`graphics`, plus `egl` because they run the headless
      # EGL/GLES render tests), and the QML + Qt Quick shell components that
      # declare `cxx-qt` (`ui`/`qt`: their build script resolves Qt through
      # pkg-config, so they need the Qt 6 development packages, and their
      # headless tests load real QML modules — the QML evaluation/0035/0036). The QML
      # shards also install fonts, because Qt lays the projection's text out at
      # render time and an empty font set would make the pixel assertions test
      # an empty frame. Every other shard stays cheap. The package lists live in
      # one place — see `.github/actions/system-deps/action.yml`.
      - uses: ./.github/actions/system-deps
        if: matrix.graphics || matrix.qt || matrix.pam
        with:
          egl: ${{ matrix.graphics }}
          fonts: ${{ matrix.qt }}
          qt: ${{ matrix.qt }}
      # One job per crate keeps a failure attributable and keeps the command the
      # same one a developer runs locally: `cargo test -p <crate>`.
      #
      # The L3 render tests assert on pixels and, when this variable is set,
      # also write every frame they asserted on as a PNG. Collecting the
      # directory as an artifact is what turns acceptance Q02's "截图覆盖浅/深/
      # 错误态" from a claim into something a reviewer can open. The path is
      # absolute because a test binary runs with its own crate directory as the
      # working directory, so a relative path would scatter files per crate.
      # `QT_QPA_PLATFORM=offscreen`: the QML shell tests create a `QQuickWindow`
      # and grab frames without a display. The panel/lock hosts force this
      # platform themselves before their single `QGuiApplication` exists; the
      # window components read it from the environment, and their
      # QML-load tests spawn a child binary with it (contract §7 item 3).
      - run: cargo test -p ${{ matrix.crate }} --all-features
        env:
          QT_QPA_PLATFORM: offscreen
          INOX_SCREENSHOT_DIR: ${{ github.workspace }}/target/inox-screenshots
      - uses: actions/upload-artifact@v4
        if: matrix.ui
        with:
          name: l3-screenshots-${{ matrix.crate }}
          path: target/inox-screenshots
          if-no-files-found: warn

  xwayland-e2e:
    name: XWayland end-to-end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            weston xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config libegl1
      # A third-party headless compositor is only good enough for E2 (see
      # docs/quality/acceptance.md §1); E3 needs the Inox compositor.
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      - name: Headless end-to-end test
        run: INOX_XWAYLAND_E2E=1 cargo test -p inox-xwayland --all-features --test headless_x11_mapping -- --nocapture

  m3-e2e:
    name: M3 end-to-end (X11 interop)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The M3 job drives the real Inox compositor, which renders through
      # EGL/GLES, so it needs the same system libraries as the `test` shards
      # plus the X11 side: `xwayland` (spawned by xwayland-satellite),
      # `x11-apps` for `xeyes` and `x11-utils` for `xwininfo`, and the xcb
      # packages `clang` needs to build xwayland-satellite from source.
      #
      # `qt: "true"` because "Build the binaries under test" runs
      # `cargo build --workspace`, which builds `inox-qml-prototype` and so
      # needs a Qt installation for `cxx-qt`'s build script.
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          qt: "true"
      - name: X11 and build dependencies
        run: |
          sudo apt-get install -y --no-install-recommends \
            xwayland x11-apps x11-utils \
            clang libxcb1 libxcb-cursor0 libxcb-cursor-dev pkg-config
      # Same tag as the weston job: clipboard support needs >= v0.4, the
      # UTF8_STRING alias and X11->Wayland INCR >= v0.5.1, primary selection
      # >= v0.7 and Wayland->X11 INCR >= v0.8.
      - name: Install xwayland-satellite
        run: cargo install --locked --git https://github.com/Supreeeme/xwayland-satellite --tag v0.8.3 xwayland-satellite
      # A default-feature build must *reject* the test-only option rather than
      # quietly accept it, and every other CI job builds with `--all-features`,
      # so this is the only place that path is ever exercised. It runs before the
      # feature build below because both write the same binary path.
      - name: A default build rejects the test-only option
        run: |
          cargo build -p inox-compositor
          if target/debug/inox-compositor --test-input /tmp/inox-must-be-rejected.sock 2>stderr.txt; then
            echo "a default-feature build accepted --test-input" >&2
            exit 1
          fi
          grep -q "test-input" stderr.txt || {
            echo "the rejection did not name the option:" >&2
            cat stderr.txt >&2
            exit 1
          }
      # The tests drive the compositor and the XWayland service as processes and
      # find them next to their own executable, so both binaries must be built
      # first. `test-input` is the non-default, test-only input injection source
      # the M3 tests need; it is inert without the flag.
      - name: Build the binaries under test
        run: |
          cargo build --workspace --features inox-compositor/test-input
      # E3 evidence (docs/quality/acceptance.md §1): a third-party host is not
      # enough, so this runs the Inox compositor itself with a real X11 client,
      # the satellite bridge and real Wayland clients.
      - name: M3 interop end-to-end
        env:
          INOX_M3_E2E: "1"
          # Also run the `xeyes`/`xwininfo` leg (a real X11 application).
          INOX_M3_E2E_REAL_APPS: "1"
        run: cargo test -p inox-integration --all-features -- --nocapture

  session-e2e:
    name: L4 headless session
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          fonts: "true"
          qt: "true"
      - name: Build the real session components
        run: cargo build -p inox-compositor -p inox-session -p inox-shell -p inox-panel -p inox-wallpaper -p inox-notifications -p inox-idle -p inox-lock
      # `--test headless` is the L4 session services shutdown budget; `--test session_lock` is
      # the E3 half of acceptance S02 — the same session, with the session's own
      # token delivered to a real trusted lock client, taking the real session lock
      # on the real compositor and still logging out inside that budget.
      - name: Verify startup, the session lock and bounded logout on Inox
        env:
          INOX_SESSION_E2E_BIN_DIR: ${{ github.workspace }}/target/debug
        run: dbus-run-session -- cargo test -p inox-session --test headless --test session_lock -- --nocapture

  input-method-e2e:
    name: Fcitx5 Chinese input on Inox
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/system-deps
        with:
          egl: "true"
          fonts: "true"
      - name: Install the external test input method
        run: sudo apt-get install -y --no-install-recommends fcitx5 fcitx5-pinyin dbus-daemon
      - name: Verify real pinyin preedit and Chinese commit
        env:
          INOX_FCITX5_E2E: "1"
        run: dbus-run-session -- cargo test -p inox-compositor --all-features --test input_method -- --nocapture

  license-audit:
    # the LGPL relicensing / the QML evaluation: cargo-deny only sees the Cargo dependency graph and
    # cannot audit the system Qt `.so` the runtime links. After the Qt-quick
    # migration the project is LGPLv3 and must never pull GPL-only Qt modules
    # (Qt Wayland Compositor, Qt Virtual Keyboard, Qt QML Compiler — see
    # the QML evaluation). This job installs the exact system
    # packages the shell links, then asserts (a) the apt-provided Qt modules are
    # present for the build and (b) at runtime `ldd` resolves only the declared
    # Qt modules and none of the forbidden GPL-only ones.
    name: license-audit (system Qt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system Qt 
        run: |
          sudo apt-get update
          # Same QML module names as `.github/actions/system-deps`: Ubuntu
          # ships `qml6-module-qtquick*` in noble, and `qml6-module-quick` /
          # `qml6-module-quick-window` do not exist there (an install of a
          # nonexistent name aborts apt with exit 100).
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev \
            qml6-module-qtquick qml6-module-qtquick-window \
            qml6-module-qtquick-templates qml6-module-qtquick-controls \
            libqt6waylandclient6 qt6-wayland-dev
          # GPL-only modules must NOT be present: their presence means a build
          # could silently link a GPL dependency into the LGPL project.
          if dpkg -l | grep -E 'qtwayland6-compositor|qt6-virtualkeyboard|qtdeclarative-scxml' >/dev/null; then
            echo "a GPL-only Qt module is installed; refusing" >&2
            dpkg -l | grep -E 'qtwayland6-compositor|qt6-virtualkeyboard'
            exit 1
          fi
      - name: Assert only LGPL Qt modules are linked (ldd)
        run: |
          # Compile a trivial Qt Quick program against the installed LGPL modules
          # and assert its runtime link set stays within the LGPL allow-list.
          set -euo pipefail
          cat > /tmp/linkcheck.cpp <<'CPP'
          #include <QGuiApplication>
          #include <QQmlApplicationEngine>
          int main(int argc, char **argv) {
              QGuiApplication app(argc, argv);
              QQmlApplicationEngine engine;
              return app.exec();
          }
          CPP
          QT_PKG=$(pkg-config --cflags --libs Qt6Gui Qt6Qml Qt6Quick)
          # shellcheck disable=SC2086
          c++ /tmp/linkcheck.cpp -o /tmp/linkcheck $QT_PKG
          ldd /tmp/linkcheck > /tmp/linkcheck.ldd || true
          # Every linked Qt library must be one allowed LGPL module. The list is
          # an allow-list, not a deny-list: a module nobody has vetted fails, so
          # a GPL-only module cannot slip in just by being new. The entries are
          # the LGPLv3 Qt 6 modules that a `QGuiApplication` +
          # `QQmlApplicationEngine` program pulls in — the core four plus the
          # transitively-linked Qml runtime, network, D-Bus and OpenGL helpers.
          # `Qt6QmlCompiler` is deliberately absent: Qt's QML compiler is
          # GPL-only, so linking it must fail here.
          #
          # `sed` strips the `.so` suffix so the case labels below are module
          # names; keeping the suffix in one place is what let the previous
          # revision compare `libQt6Core.so` against a `libQt6Core` label and
          # reject every module, including the allowed ones.
          grep -oE 'libQt6[A-Za-z]+\.so' /tmp/linkcheck.ldd \
            | sed -E 's/\.so$//' | sort -u > /tmp/linkcheck.modules
          cat /tmp/linkcheck.modules
          # An empty list would make the loop below pass vacuously, which is the
          # one way this job could report success without auditing anything.
          if [ ! -s /tmp/linkcheck.modules ]; then
            echo "no Qt modules found in ldd output; the link check is not auditing anything" >&2
            exit 1
          fi
          while read -r mod; do
            case "$mod" in
              libQt6Core|libQt6Gui|libQt6Qml|libQt6Quick|\
              libQt6DBus|libQt6Network|libQt6OpenGL|\
              libQt6QmlMeta|libQt6QmlModels|libQt6QmlWorkerScript|\
              libQt6QmlIntegration|libQt6WaylandClient)
                echo "OK (LGPL): $mod"
                ;;
              *)
                echo "FORBIDDEN GPL-only Qt module linked: $mod" >&2
                exit 1
                ;;
            esac
          done < /tmp/linkcheck.modules
          echo "license-audit: only LGPL Qt modules linked"

  # The documentation site is built here, and its structure is checked.
  #
  # `mdbook build` on its own is a weak gate — it exits 0 when a chapter listed in
  # SUMMARY.md does not exist (it emits a placeholder page carrying the chapter
  # title) and it says nothing about relative links written in prose. Both classes
  # of breakage reach the published site as 404s, which is how `docs/quality/`
  # kept a dead `../../PRD.md` link and ADR references after the ADR directory was
  # deleted. `scripts/check-docs.py` closes exactly that gap:
  #
  #   - every chapter in SUMMARY.md exists, and every page under `src/` is in it
  #   - every relative link and image target under `docs/` resolves
  #
  # Network links are skipped on purpose (a gate that needs the network fails for
  # the wrong reason). markdownlint runs in the separate Docs workflow and covers
  # style only.
  book:
    name: book
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install mdbook
        uses: taiki-e/install-action@v2
        with:
          tool: mdbook
      - name: Check the documentation structure and links
        run: scripts/check-docs.py
      - name: Build the documentation site
        run: mdbook build docs/book

  # Build the release tarball on every PR and every push to main.
  #
  # This job exists so the artifact E4 hardware acceptance runs on (acceptance.md
  # §1: "E4 使用 CI 产出的二进制") is produced and exercised continuously, rather
  # than assembled by hand on release day. It builds with DEFAULT features —
  # `--all-features` would compile in `inox-compositor/test-input`, a socket that
  # accepts injected keyboard and pointer events.
  #
  # The verification that the staged binary really is a default-features build is
  # inside packaging/package.sh: it runs the staged compositor with `--test-input`
  # and fails if the option is accepted. A unit test cannot cover that, because the
  # property belongs to the artifact rather than to the source tree.
  package:
    name: package (canary tarball)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # BUILD-INFO records the commit; a shallow clone still has HEAD, and
          # `git status --porcelain` needs a worktree rather than history.
          fetch-depth: 1
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The release build links Qt and Mesa for real, and needs the PAM/clang
      # includes for `inox-auth`'s server feature.
      - uses: ./.github/actions/system-deps
        with:
          qt: "true"
      # The packaging directory is the install surface the tarball ships, and it is
      # the one part of this repository no other job compiles or tests. A syntax
      # error in `uninstall.sh` or `rollback-to-greetd.sh` is invisible until the
      # moment somebody needs it — which is the moment their machine is in the
      # half-installed state those scripts exist to get out of.
      - name: Check the packaging scripts
        run: |
          set -euo pipefail
          # `packaging/aur` is spelled out rather than relying on `packaging/*.sh`:
          # the AUR recipe's script lives one directory down and would silently
          # escape a non-recursive glob.
          for script in packaging/*.sh packaging/aur/*.sh scripts/*.sh; do
            bash -n "$script"
            printf 'ok: %s\n' "$script"
          done
          # The Python helpers are not run here (check-docs is its own job), but a
          # syntax error should surface in the same place as a shell one.
          for script in scripts/*.py; do
            python3 -m py_compile "$script"
            printf 'ok: %s\n' "$script"
          done
          # --help must not touch the system: it is answered before any root check.
          packaging/package.sh --help >/dev/null
          packaging/install.sh --help >/dev/null
          packaging/uninstall.sh --help >/dev/null
          # The AUR script's --help answers without makepkg, so it is checkable
          # here even though its real checks run in the `aur` job.
          packaging/aur/publish.sh --help >/dev/null

      - name: Build and package
        run: packaging/package.sh --output-dir target/dist
      - name: Check the tarball and its metadata
        run: |
          set -euo pipefail
          cd target/dist
          ls -l
          # The tarball is what a tester downloads; its checksum file must agree
          # with it or the install instructions are a lie.
          sha256sum --check ./*.tar.gz.sha256
          # BUILD-INFO is inside the archive; print it from there so a broken
          # archive (wrong root directory, missing metadata) fails this job rather
          # than the person who downloaded it.
          tarball="$(ls ./*.tar.gz)"
          tar -xzOf "$tarball" --wildcards '*/BUILD-INFO'
          # The archive must carry exactly one top-level directory, all fourteen
          # shipped binaries, the wallpapers and the install surface.
          #
          # The listing is read ONCE into a file. `tar -tzf ... | grep -q` looks
          # equivalent but is not: grep exits at the first match, tar then dies of
          # SIGPIPE, and `pipefail` turns that into a failure — so the check
          # reports "missing" for a file it just found. That is not theoretical;
          # it failed this job on its first run.
          tar -tzf "$tarball" >"$RUNNER_TEMP/archive-listing.txt"

          roots="$(cut -d/ -f1 "$RUNNER_TEMP/archive-listing.txt" | sort -u)"
          if [ "$(printf '%s\n' "$roots" | wc -l)" -ne 1 ]; then
            echo "the archive does not have exactly one top-level directory:" >&2
            printf '%s\n' "$roots" >&2
            exit 1
          fi
          echo "top-level directory: $roots"

          missing=()
          for binary in inox-auth inox-host inox-compositor inox-greet inox-session \
              inox-shell inox-panel inox-lock inox-wallpaper inox-notifications \
              inox-idle inox-xwayland inox-launcher inox-settings; do
            grep -qx "$roots/bin/$binary" "$RUNNER_TEMP/archive-listing.txt" \
              || missing+=("bin/$binary")
          done
          grep -qx "$roots/packaging/install.sh" "$RUNNER_TEMP/archive-listing.txt" \
            || missing+=("packaging/install.sh")
          grep -q "^$roots/data/wallpapers/" "$RUNNER_TEMP/archive-listing.txt" \
            || missing+=("data/wallpapers/")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "the archive is missing:" >&2
            printf '  %s\n' "${missing[@]}" >&2
            exit 1
          fi
          echo "ok: $tarball contains the binaries, the wallpapers and the install surface"
      - name: Upload the tarball
        uses: actions/upload-artifact@v4
        with:
          name: inox-canary-tarball
          path: |
            target/dist/*.tar.gz
            target/dist/*.tar.gz.sha256
          if-no-files-found: error
          retention-days: 30

  # Check the AUR recipe on Arch, where its users run it.
  #
  # The recipe is the one deliverable whose consumer is another distribution's
  # package manager: a typo in a dependency name or a malformed .SRCINFO is not
  # visible from the source tree, and a broken PKGBUILD is published to a public
  # AUR page, not to a red CI job. This job therefore renders the recipe for both
  # channels and runs `makepkg --printsrcinfo` and the dependency-name check
  # (inside packaging/aur/publish.sh) on every PR and every push to main.
  #
  # What it deliberately does NOT do is build the package: the full workspace
  # build is ~half an hour and belongs in the release workflow, which builds and
  # verifies the package before anything is pushed to the AUR
  # (`.github/workflows/release.yml`, job `publish-aur`). Cheap and continuous
  # here, complete once before a release.
  aur:
    name: aur (recipe)
    runs-on: ubuntu-latest
    # Arch is the target: `makepkg` only exists there, and the dependency names
    # must resolve against Arch's repositories, not Ubuntu's.
    container:
      image: archlinux:base-devel
    steps:
      - name: Install git into the container
        run: |
          pacman -Sy --noconfirm archlinux-keyring
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed git
          useradd -m builder
      - uses: actions/checkout@v4
      - name: Render the recipe for both channels
        run: |
          set -euo pipefail
          version="$(sed -n '/^\[workspace\.package\]/,/^\[/p' Cargo.toml \
            | sed -n 's/^version *= *"\(.*\)"/\1/p' | head -1)"
          [ -n "$version" ] || { echo "could not read the workspace version" >&2; exit 1; }

          # makepkg refuses to run as root. Work on a builder-owned copy rather
          # than chowning the checkout, so the checkout action's root-owned post
          # step keeps working.
          install -d -o builder -g builder -m 0755 /home/builder/work
          cp -a -- "$GITHUB_WORKSPACE/." /home/builder/work/
          chown -R builder:builder /home/builder/work

          # `runuser` only swaps uid/gid; HOME has to be set explicitly or the
          # build user would inherit root's /root.
          check_recipe() {
            runuser -u builder -- env HOME=/home/builder bash -c '
              cd "$1"
              shift
              packaging/aur/publish.sh "$@"
            ' _ /home/builder/work "$@"
          }

          # Stable channel: package `inox`.
          check_recipe --version "$version" --sha256 SKIP
          # Pre-release channel: package `inox-canary`, pkgver with `_` instead of
          # `-`. Checking it here is what keeps the mapping from rotting between
          # releases, which is the only time it matters.
          check_recipe --version "$version-canary.1" --sha256 SKIP
