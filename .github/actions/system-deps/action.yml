name: System libraries
description: >-
  Install the system libraries the Inox workspace needs in order to build.
  One source of truth for the package list, so a job cannot silently drift
  from the others.

inputs:
  egl:
    description: >-
      Also install EGL/Mesa. Only tests that actually render need it: Smithay's
      GlesRenderer dlopen()s libEGL.so.1 at runtime and nothing links it at
      build time, so type-checking and release builds can skip it.
    required: false
    default: "false"
  fonts:
    description: >-
      Also install Latin and CJK font packages. The L3 shell components render their real
      widget tree through cosmic-text in tests, and cosmic-text lays text out
      from the fonts it finds on the system: on a runner with no font installed
      a label renders as nothing and the pixel assertions in those tests would
      be testing an empty frame. Only the crates that declare `iced` need it.
    required: false
    default: "false"
  qt:
    description: >-
      Also install the Qt 6 development packages the QML/Qt Quick host needs
      (ADR 0033 / ADR 0035). cxx-qt builds rust-side QObject bridges and its
      build script resolves Qt through `pkg-config` (Qt6Core/Qt6Gui/Qt6Qml/
      Qt6Quick/Qt6QmlModels), so every job that runs a build script that touches
      a QML crate needs the dev packages — even when a job only type-checks.
      qt6-wayland-dev pulls the Wayland client the L3 layer surfaces attach
      with. Only the crates that declare `cxx-qt` need it.
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # These are *build-script* dependencies as well as link-time ones, which is
    # the part that is easy to get wrong: `libudev-sys`'s build script calls
    # `pkg-config --libs --cflags libudev` and panics if libudev.pc is absent.
    # Build scripts run for `cargo clippy` and `cargo doc` too, so those jobs
    # need these packages even though neither of them links a final binary.
    #
    # libxkbcommon-dev: Smithay's `wayland_frontend` links the system
    # `libxkbcommon` (-lxkbcommon) in the test and build link steps; the dev
    # package also pulls the runtime libxkbcommon0.
    # xkb-data: the rules files the compositor compiles its deterministic
    # evdev/us keymap from; without it the seat keyboard cannot be created.
    # libseat-dev / libdrm-dev / libgbm-dev / libinput-dev / libudev-dev: the
    # M2.5 real backend (ADR 0010) links these through Smithay's `backend_*`
    # features. The runner has no DRM master and no input-device permissions, so
    # that code path is compile-checked only and never exercised here.
    - shell: bash
      run: |
        sudo apt-get update
        # libpam0g-dev: `pam-sys`'s build script links -lpam and -lpam_misc, so
        # every job that runs a build script needs the dev symlink even when it
        # does not link a final binary (clippy and doc included). ADR 0029.
        sudo apt-get install -y --no-install-recommends \
          libxkbcommon-dev xkb-data libpam0g-dev \
          libseat-dev libdrm-dev libgbm-dev libinput-dev libudev-dev
        if [ "${{ inputs.fonts }}" = "true" ]; then
          sudo apt-get install -y --no-install-recommends fonts-dejavu-core fonts-noto-cjk
        fi
        if [ "${{ inputs.egl }}" = "true" ]; then
          # libegl1 is the GLVND loader and pulls Mesa's EGL vendor driver
          # (libegl-mesa0 -> libgbm1, libglapi-mesa, mesa-libgallium);
          # libgl1-mesa-dri provides the DRI drivers including the llvmpipe /
          # swrast software rasteriser behind LIBGL_ALWAYS_SOFTWARE=1.
          sudo apt-get install -y --no-install-recommends libegl1 libgl1-mesa-dri
        fi
        if [ "${{ inputs.qt }}" = "true" ]; then
          # Qt 6 development + QML host for the Qt Quick migration (ADR 0035).
          # qt6-base-dev / qt6-declarative-dev provide Qt6Core/Gui/Qml/Quick
          # .pc files and headers (cxx-qt resolves them via pkg-config);
          # qml6-module-quick is the QtQuick QML module itself (needed at runtime
          # to load a `.qml` root offscreen). libqt6waylandclient6 + qt6-wayland-dev
          # are the Wayland client the L3 layer surfaces attach through. No
          # GPL-only Qt module (Qt Wayland Compositor etc.) is pulled here — see
          # the license-audit job which asserts exactly that (ADR 0033/0034).
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-declarative-dev qml6-module-quick \
            qt6-wayland-dev
        fi
