# The `greeter` system account, created by systemd-sysusers.
#
# Who reads this file:
#   - pacman, through systemd's systemd-sysusers.hook, for an AUR package install;
#   - packaging/install.sh creates the same account with `useradd --system` for a
#     release-tarball install.
#
# The two must agree: inox-greeter@.service runs as `greeter`, the auth boundary
# chowns its socket to the account's group, and libseat's logind backend resolves
# the seat from that account's logind session. A different home directory or
# shell between the two installation routes would be a defect that only shows up
# on one of them.
#
# This is a system account: no login shell, no password, home owned by the unit's
# StateDirectory= (systemd creates /var/lib/inox-greeter on first start).
#
# `u` only creates the account when it does not exist yet; it never modifies an
# existing one. That matters on a machine that also has greetd installed, whose
# package already ships a `greeter` account: Inox then runs its login screen as
# that account, exactly like packaging/install.sh does ("the greeter account
# already exists ... leaving it alone"). Changing the shell or home of an account
# another package owns would be a defect.
u greeter - "Inox login screen" /var/lib/inox-greeter /usr/bin/nologin
