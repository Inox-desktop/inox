[package]
name = "inox-panel"
description = "The Inox desktop panel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]# The panel's event loop, its signal sources and its clock (root AGENTS.md §4).
calloop.workspace = true
zbus.workspace = true
anyhow.workspace = true
# Civil time in the session's timezone for the panel clock.
chrono.workspace = true
# : the interface is QML + Qt Quick, bound through cxx-qt
# and rendered **offscreen** into the layer surface's shared-memory
# frame. `cxx` is the FFI layer, `cxx-qt-lib` wraps `QString`/`QByteArray`, and
# `cxx-qt` provides the bridge. There is no Qt Wayland client and no
# LayerShellQt: the surface stays the `wlr-layer-shell` one `src/layer.rs` owns.
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
# L1: the shared Fluent loader and the design tokens. L3 components take no
# same-layer dependency and no dependency on the compositor.
inox-common.workspace = true
inox-config.workspace = true
# A legal downward L3 -> L2 edge: the protocol bindings are owned by L2 and
# `inox-protocols` is the single source of truth for them, so the
# panel does not name `wayland-protocols` or `wayland-protocols-wlr` itself.
inox-protocols.workspace = true
# The one L3 -> L3 edge, authorised by ADR 0040 and registered in the root
# `Cargo.toml`'s `same_layer_exceptions`: the glass material decision (clamps,
# v1/v2 negotiation, the fallback reasons) and the glass QML components live
# there, so the panel does not grow a second copy of the arithmetic.
inox-glass.workspace = true
# Reading the compositor's events, creating the layer surface, taking pointer
# input and asking for frosted glass.
wayland-client.workspace = true
# A frame is a shared-memory buffer; `memfd_create` is the safe way to get an
# anonymous one.
rustix = { workspace = true, features = ["fs"] }
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
# The QML view is a Qt-free JSON projection (`src/view.rs`, contract §3): the
# model is serialised here and handed to the QML renderer as one string.
serde_json.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true
# `build.rs` generates `inox-shell-v1`'s C client bindings and compiles them,
# together with `src/native/*.cpp`, on a host whose Qt can carry the private ABI
# (`cfg(native_surface)`, decided by the build script — see ADR 0046 §10).
cc.workspace = true
# `build.rs` compiles `inox-glass`'s QML assets into this crate's own QML
# module (`inox_glass::qml_files()`), because a QML module belongs to the
# binary that registers it (KDAB/cxx-qt#770).
inox-glass.workspace = true
# The same 0.10 line `cxx-qt-build` 0.10.0 already resolves (cargo unifies the
# two). It is named directly because `build.rs` aliases the glass QML files
# inside the qrc itself (`QResourceFile::alias`), and `cxx-qt-build` re-exports
# `QResource`/`QResources` but not `QResourceFile`.
qt-build-utils.workspace = true

[dev-dependencies]
# The protocol tests in `src/tests/protocol.rs` play the compositor side of
# `wlr-layer-shell-unstable-v1`, `wl_shm`, `wl_seat` and `inox-glass-v1` on a
# real socket pair and drive the built binary as a subprocess, the pattern
# `inox-lock` established.
wayland-server.workspace = true
proptest.workspace = true
tempfile.workspace = true

# The workspace forbids `unsafe_code`, but `#[cxx_qt::bridge]` (see
# `src/cxxqt_object.rs`) emits `unsafe extern "C++"` blocks without an
# `#[allow]` wrapper, so the generated FFI glue cannot compile under `forbid`.
# This is the exception; Inox-authored Rust in this crate stays
# unsafe-free (see `src/main.rs`'s crate documentation and `AGENTS.md`).
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
