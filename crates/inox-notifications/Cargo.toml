[package]
name = "inox-notifications"
description = "The Inox notification daemon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
calloop.workspace = true
anyhow.workspace = true
# The D-Bus service itself (M5, acceptance D06). ADR 0022 §5 records the choice,
# the licence (MIT) and why only the blocking API is used.
zbus.workspace = true
# The session lock state the daemon needs to withhold notification bodies while
# the session is locked: the compositor is the authority and publishes it over
# the private `inox-ipc` protocol (ADR 0022 §4). This is an L3 -> L2 dependency,
# which ADR 0002 rule 1 allows (it is downward) and ADR 0022 §7 records.
inox-protocols.workspace = true
wayland-client.workspace = true
# ADR 0003 fixes Iced for every shell component; the workspace entry selects the
# tiny-skia renderer, which is what the headless render tests draw through.
iced.workspace = true
# L1: the shared Fluent loader and the design tokens. L3 components take no
# same-layer dependency and none on the compositor (ADR 0013, 0018).
inox-common.workspace = true
inox-config.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# The headless render harness: `iced` re-exports neither `UserInterface` nor the
# tiny-skia renderer, so the three crates are named directly (ADR 0018).
iced_core.workspace = true
iced_runtime.workspace = true
iced_tiny_skia.workspace = true
# `INOX_SCREENSHOT_DIR` writes the acceptance snapshots (Q02).
image.workspace = true
proptest.workspace = true
tempfile.workspace = true

[lints]
workspace = true
