[package]
name = "inox-launcher"
description = "The Inox application launcher"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# ADR 0002: `inox-launcher` is L3. It depends on L1 only — the index, the search
# and the activation state machine are this crate's own, and no other L3
# component or the compositor is linked in. The layer table
# in the root `Cargo.toml` is enforced by
# `cargo test -p inox-integration --test layering`.
[dependencies]
calloop.workspace = true
zbus.workspace = true
anyhow.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

# L1: the Fluent catalogs and the XDG path rules.
inox-common.workspace = true
# L1: the shell configuration (`shell.toml`'s `[launcher]`) and the theme tokens
# every colour and size in `view.rs` and `theme.rs` comes from.
inox-config.workspace = true

# : the window is Qt Quick, reached through the cxx-qt bridge in
# `src/cxxqt_object.rs`. `cxx` is the FFI layer the bridge macro expands into,
# `cxx-qt-lib` wraps the Qt value type the projection publishes (QString), and
# `cxx-qt-build` (a build dependency) registers the bundled QML module.
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true

# The projection is one JSON document (docs/qml-migration-contract.md §3): the
# bridge hands QML a `model_json` string, and QML parses it once per change.
serde.workspace = true
serde_json.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# The workspace forbids `unsafe` (root AGENTS.md §3.2), but the
# `#[cxx_qt::bridge]` macro (see `src/cxxqt_object.rs`) emits
# `unsafe extern "C++"` blocks without an `#[allow]` wrapper, so the generated
# FFI glue cannot compile under `forbid`. Override it to `allow` here; Inox-authored code stays
# unsafe-free.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
