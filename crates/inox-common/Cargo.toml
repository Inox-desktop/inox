[package]
name = "inox-common"
description = "Shared types, error handling and logging utilities for the Inox desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# ADR 0002 rule 2: `inox-common` is the leaf. It depends on no other Inox crate,
# and `crates/inox-integration/tests/layering.rs` enforces that on every run.
[dependencies]
thiserror.workspace = true
tracing.workspace = true

# Project Fluent (PRD §11.2). `fluent-syntax` is used directly as well as
# through `fluent-bundle`: the catalog-parity check that keeps `en-US` and
# `zh-CN` in step needs the parsed AST, not just the loaded bundle.
fluent-bundle.workspace = true
fluent-syntax.workspace = true
unic-langid.workspace = true
tracing-subscriber.workspace = true

# ADR 0029: `secret` is the one reviewed implementation of the credential
# buffer's invariants (zeroed on clear and on drop, unprintable, a single
# accessor). `zeroize` is the crate the workspace already relies on for the same
# job in `inox-lock`; it is a leaf, pure-data dependency (MIT OR Apache-2.0), so
# it does not bring a UI toolkit, an event loop or a device API into L1.
zeroize.workspace = true

[lints]
workspace = true
