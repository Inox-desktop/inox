[package]
name = "inox-qml-prototype"
description = "cxx-qt/Qt Quick proof-of-prototype crate demonstrating the Rust-to-QML bridge for the Inox desktop migration"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# This is an evidence crate for the LGPL/QML migration (ADR 0033/0035): it shows
# the cxx-qt 0.10 binding surface we rely on. It is deliberately self-contained
# — no Inox workspace *crate* dependency — so it compiles and runs standalone.
[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
anyhow.workspace = true
tracing.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# The workspace favours `unsafe_code = "forbid"`, but the `#[cxx_qt::bridge]`
# macro (see `src/cxxqt_object.rs`) emits `unsafe extern "C++"` / `unsafe fn`
# blocks without an `#[allow]` wrapper, so the generated FFI glue cannot compile
# under `forbid`. Override it to `allow` at crate level (ADR 0035 exception,
# documented in this crate's `AGENTS.md`); Inox-authored code stays unsafe-free.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"