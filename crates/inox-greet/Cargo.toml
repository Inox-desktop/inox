[package]
name = "inox-greet"
description = "The Inox display manager (greeter)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# This package is deliberately **bin-only** (no `src/lib.rs`, no `tests/`).
# cxx-qt 0.10 embeds the bridge's generated `cxx_qt_init_*` initializers in the
# target that declares the bridge; a second target in the same package that links
# the bridge's generated C++ archive without referencing those symbols fails with
# `undefined reference` (KDAB/cxx-qt#770). Every test therefore lives inside the
# binary as a `#[cfg(test)]` module (`src/headless_tests.rs` and the per-module
# test modules), and the headless QML check spawns that binary as a child.
[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
# The UI projection is one JSON value per state change (docs/qml-migration-contract.md
# §3); `serde_json` is already in the workspace dependency table.
serde_json.workspace = true
inox-common.workspace = true
inox-config.workspace = true
# The `auth-v1` contract and its framing, and nothing else: this crate takes
# `inox-auth` with the workspace's `default-features = false`, so the login
# *screen* does not link `libpam` and does not contain the code that can start a
# session.
inox-auth.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
tempfile.workspace = true

# The workspace forbids `unsafe` (root AGENTS.md §3.2), but the
# `#[cxx_qt::bridge]` macro (see `src/cxxqt_object.rs`) emits
# `unsafe extern "C++"` blocks without an `#[allow]` wrapper, so the generated
# FFI glue cannot compile under `forbid`. Override it to `allow` here; Inox-authored Rust in this
# crate still contains no `unsafe`.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
