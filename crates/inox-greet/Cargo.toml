[package]
name = "inox-greet"
description = "The Inox display manager (greeter)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
inox-common.workspace = true
inox-config.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

# The workspace forbids `unsafe` (root AGENTS.md §3.2), but the
# `#[cxx_qt::bridge]` macro (see `src/cxxqt_object.rs`) emits
# `unsafe extern "C++"` blocks without an `#[allow]` wrapper, so the generated
# FFI glue cannot compile under `forbid`. Override it to `allow` here (ADR 0035
# exception, recorded in this crate's `AGENTS.md`); Inox-authored code stays
# unsafe-free.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
