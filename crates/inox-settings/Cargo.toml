[package]
name = "inox-settings"
default-run = "inox-settings"
description = "The Inox system settings application"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# The window is QML on top of a Rust state machine: cxx-qt is the
# only QML↔Rust boundary, and the crate is bin-only because the bridge's generated
# initializers have to live in the target that declares the bridge
# (`docs/qml-migration-contract.md` §2.1, KDAB/cxx-qt#770).
[dependencies]
cxx.workspace = true
cxx-qt.workspace = true
cxx-qt-lib.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
zbus.workspace = true
# L1: the shared Fluent loader and the design tokens. L3 components take no
# same-layer dependency and no dependency on the compositor.
inox-common.workspace = true
inox-config.workspace = true
toml.workspace = true
toml_edit.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[build-dependencies]
cxx-qt-build.workspace = true

[dev-dependencies]
proptest.workspace = true
tempfile.workspace = true

# The workspace forbids `unsafe` (root AGENTS.md §3.2), but the
# `#[cxx_qt::bridge]` macro (see `src/cxxqt_object.rs`) emits
# `unsafe extern "C++"` blocks without an `#[allow]` wrapper, so the generated
# FFI glue cannot compile under `forbid`. Override it to `allow` here; Inox-authored code stays
# unsafe-free.
[lints.rust]
unsafe_code = "allow"
missing_docs = "warn"

[lints.clippy]
all = "warn"
