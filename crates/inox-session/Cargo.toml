[package]
name = "inox-session"
description = "The Inox session manager"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[dependencies]
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
calloop.workspace = true
inox-common.workspace = true
inox-config.workspace = true
inox-protocols.workspace = true
# `rand` is what mints the session's lock token; see `policy::session_lock_token`.
rustix = { workspace = true, features = ["rand"] }
thiserror.workspace = true
wayland-client.workspace = true

[dev-dependencies]
tempfile.workspace = true
wayland-server.workspace = true
# `tests/session_lock.rs` signals the running session the way a logout does.
rustix = { workspace = true, features = ["process"] }

[lints]
workspace = true
