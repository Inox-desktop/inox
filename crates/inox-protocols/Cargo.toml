[package]
name = "inox-protocols"
description = "Wayland protocol bindings and Inox protocol extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

# layering rule 4: this crate is the single exit point for protocols. It has no
# Inox dependency of its own — it sits on `wayland-rs` alone.
[dependencies]
wayland-backend.workspace = true
wayland-client.workspace = true
wayland-server.workspace = true
wayland-scanner.workspace = true
# `inox-glass-v1` v2 declares `refraction_flag` as a bitfield, which the
# scanner generates with `bitflags!`; the generated code names this crate
# directly, so it must be a dependency here.
bitflags.workspace = true
wayland-protocols = { workspace = true, features = [
    "client",
    "server",
    "staging",
    "unstable",
] }
wayland-protocols-wlr.workspace = true
wayland-protocols-misc.workspace = true

[lints]
workspace = true
