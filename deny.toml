# cargo-deny policy for the whole workspace (ADR 0016).
#
# This replaces the up-to-18 per-repository `deny.toml` copies, which each saw
# only their own dependency subgraph. Licence, advisory and duplicate-version
# checks now run against the real, complete graph. The former `[sources]
# allow-git = ["https://github.com/Inox-desktop/inox-common"]` entries are gone
# with the git dependencies themselves: workspace-internal crates are path
# dependencies, so `unknown-git = "deny"` is now purely restrictive.

[advisories]
yanked = "warn"
# Both entries are `unmaintained` advisories — neither is a vulnerability, and
# neither has a safe upgrade. Each is reachable only through a core dependency
# that an accepted ADR fixes, so "upgrade away from it" is not an option this
# repository has on its own; the alternative would be to drop the toolkit.
#
# `cgmath` (RUSTSEC-2026-0196) is an unavoidable transitive dependency of
# Smithay v0.7.0 (ADR 0003). Revisit when Smithay drops it.
#
# `ttf-parser` (RUSTSEC-2026-0192) is cosmic-text's font parser, reached
# through `iced_graphics` -> `cosmic-text` -> `fontdb`. Iced 0.14 (ADR 0003)
# lays out all text through cosmic-text, so every L3 component depends on it.
# The advisory's suggested replacement (`skrifa`) is a change upstream has to
# make first; track it, and drop this entry once iced moves off ttf-parser.
ignore = ["RUSTSEC-2026-0196", "RUSTSEC-2026-0192"]

[licenses]
# Root AGENTS.md §3.6: permissive licences only; no GPL/AGPL/SSPL in the core
# dependency graph.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
]

[bans]
multiple-versions = "warn"
# A dependency without a version requirement is a wildcard. Workspace-internal
# path dependencies therefore carry an explicit `version` in
# `[workspace.dependencies]`.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
