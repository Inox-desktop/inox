# cargo-deny policy for the whole workspace.
#
# This replaces the up-to-18 per-repository `deny.toml` copies, which each saw
# only their own dependency subgraph. Licence, advisory and duplicate-version
# checks now run against the real, complete graph. The former `[sources]
# allow-git = ["https://github.com/Inox-desktop/inox-common"]` entries are gone
# with the git dependencies themselves: workspace-internal crates are path
# dependencies, so `unknown-git = "deny"` is now purely restrictive.

[advisories]
yanked = "warn"
# The entry below is an `unmaintained` advisory, not a vulnerability, and it has
# no safe upgrade from here: it is reachable only through a core dependency that
# an accepted ADR fixes, so "upgrade away from it" is not an option this
# repository has on its own; the alternative would be to drop the toolkit.
#
# `cgmath` (RUSTSEC-2026-0196) is an unavoidable transitive dependency of
# Smithay v0.7.0. Revisit when Smithay drops it.
#
# `ttf-parser` (RUSTSEC-2026-0192) used to be here and has been dropped from
# this list: it left the graph with Iced. The QML shell components lay text out
# in Qt Quick, not cosmic-text, so `iced_graphics -> cosmic-text -> fontdb` no
# longer exists.
#
# The three `users` entries are **not** that shape: two of them are real defects
# in the crate, and they are ignored because no code in this workspace reaches
# the functions they are about. `users` 0.10 is reachable only through `pam`
# 0.8, whose one call is `get_user_by_name` to set `HOME`/`SHELL`/`USER` during
# `pam_open_session`; that path reads `pw_name`/`pw_uid`/`pw_gid`/`pw_dir`/
# `pw_shell` and touches none of the affected code:
#
#   * RUSTSEC-2023-0040 — the crate is unmaintained (`pam` has not moved off it);
#   * RUSTSEC-2023-0059 — an unsound unaligned read in the `gr_mem` handling of
#     `struct_to_group`, which only the group-lookup entry points reach;
#   * RUSTSEC-2025-0040 — `get_user_groups` ignores the count `getgrouplist`
#     returns and maps a whole fixed 1024-entry buffer, so group listings acquire
#     gid 0 (root's group). This workspace **used** to call it; `inox-auth` now
#     gets a session's supplementary groups from `nix::unistd::getgrouplist`,
#     which respects the count, and filters gid 0 out of the result as well
#     (`inox_auth::session::session_groups`, with tests).
#
# Removing these entries means removing the crate: track `pam`'s dependency on
# it.
ignore = [
    "RUSTSEC-2026-0196",
    "RUSTSEC-2023-0040",
    "RUSTSEC-2023-0059",
    "RUSTSEC-2025-0040",
]

[licenses]
# Relicensed to LGPL-3.0 for the Qt-quick route: the
# project aligns with Qt's LGPL and the allow-list now accepts LGPL/GPL
# libraries while keeping the aggressive copyleft out where we must. GPL-only
# Qt modules (Qt Wayland Compositor, Qt Virtual Keyboard, Qt QML Compiler) are
# still forbidden by policy, not by this list — see the QML evaluation
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "MIT",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Unlicense",
    "CC0-1.0",
    "BSL-1.0",
    "MPL-2.0",
    "LGPL-3.0",
]

[bans]
multiple-versions = "warn"
# A dependency without a version requirement is a wildcard. Workspace-internal
# path dependencies therefore carry an explicit `version` in
# `[workspace.dependencies]`.
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
