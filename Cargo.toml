# Inox desktop — cargo workspace root.
#
# ADR 0016 replaced the multi-repository strategy (ADR 0001) with this single
# workspace. Every component is a member under `crates/`; the layer table in
# `[workspace.metadata.inox]` is the single source of truth for the L1–L4
# layering of ADR 0002, and `crates/inox-integration/tests/layering.rs` asserts
# the dependency-direction rules against it on every CI run.
#
# `inox-docs` (the mdBook in `docs/book/`) is deliberately not a member: it has
# no `Cargo.toml`, takes part in no dependency graph, and is excluded from
# `cargo deny` (see root AGENTS.md §2).

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# One version for the whole workspace. Independent per-crate SemVer was the
# compatibility matrix this ADR removed; a single release line replaces it.
#
# `0.1.1` and not `0.2.0`: `inox-common`'s live release line is `v0.1.1`, and
# main's `compat.toml` records that `v0.2.0` was re-cut to it and the old tag is
# retired (the `paths` addition is a compatible change, which is a patch under
# 0.x per ADR 0010 版本号语义与发布流程, still `proposed`). Taking 0.2.0 would
# reuse a retired number. If that ADR is rejected or changes the MSRV rule
# (this migration raises MSRV to 1.86 for eleven crates), this is the one line
# to revisit.
version = "0.1.1"
edition = "2024"
# Raised to 1.88 for the L3 milestone: `iced` 0.14 — the GUI toolkit ADR 0003
# fixes for the shell components — declares `rust-version = "1.88"`, and so does
# `image` 0.25, which the wallpaper and icon paths pull in. 1.86 was the floor
# before that (`inox-protocols`' wayland-protocols 0.32 and `inox-compositor`'s
# calloop 0.14 via smithay 0.7). Only the declared floor moves; CI tracks
# `stable`. See docs/adr/0018-l3-component-architecture.md.
rust-version = "1.88"
license = "BSD-3-Clause"
repository = "https://github.com/Inox-desktop/inox"
readme = "README.md"
keywords = ["wayland", "desktop", "inox"]
categories = ["desktop"]

[workspace.dependencies]
# --- workspace-internal crates (path dependencies; never a git tag) -------
# The explicit `version` keeps `deny.toml`'s `[bans] wildcards = "deny"`
# satisfied: a path dependency without one carries an implicit `*`.
inox-common = { path = "crates/inox-common", version = "0.1" }
inox-config = { path = "crates/inox-config", version = "0.1" }
inox-protocols = { path = "crates/inox-protocols", version = "0.1" }

# --- third-party: one version for the whole graph -------------------------
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
rustix = { version = "1", features = ["process"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
toml = "0.8"

wayland-backend = "0.3"
wayland-client = "0.31"
wayland-server = "0.31"
wayland-scanner = "0.31"
wayland-protocols = "0.32"
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }

smithay = { version = "0.7.0", default-features = false, features = [
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    # Real backend (ADR 0010): session ownership via libseat, DRM/KMS output,
    # GBM render target, udev-enumerated libinput devices.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session",
    "backend_session_libseat",
] }

# --- L3 shell stack (ADR 0003 fixes Iced; see ADR 0018) -------------------
# Software rendering only: the components run under `tiny-skia`, which needs no
# GPU and is what the headless CI host can actually present. `wgpu` is
# deliberately not enabled — it would add a second renderer that no Inox
# configuration selects.
# `image-without-codecs` and not `image`: the latter turns on `image/default`,
# which drags in an AV1/EXR/AVIF codec zoo (rav1e, exr, ravif). The obvious
# problem is build time; the blocking one is that rav1e's build pulls
# libfuzzer-sys, whose `(MIT OR Apache-2.0) AND NCSA` licence is not on the
# allow-list in `deny.toml`, so `cargo deny check` fails on the whole graph.
# Between this crate's features and the `image` entry below, the unified
# feature set is exactly PNG and JPEG — what the wallpaper and the test
# snapshots need.
iced = { version = "0.14", default-features = false, features = [
    "tiny-skia",
    "wayland",
    "thread-pool",
    "crisp",
    "image-without-codecs",
] }
# `wlr-layer-shell` is how the panel, launcher, notification popups and the
# wallpaper become real desktop surfaces; `iced` itself only knows xdg-shell.
# Same iced 0.14 generation as the entry above (ADR 0018).
iced_layershell = { version = "0.19", default-features = false }

# The headless render harness every L3 component's `tests/render.rs` uses: it
# builds the real widget tree, lays it out at a fixed size and draws it into a
# pixmap through the same tiny-skia renderer the binaries use, with no
# compositor and no GPU. `iced` re-exports neither `UserInterface` nor the
# tiny-skia renderer, so the three crates are named directly -- as
# dev-dependencies only, which keeps them out of every component's shipped
# dependency surface.
iced_core = "0.14"
iced_runtime = "0.14"
iced_tiny_skia = { version = "0.14", features = ["image"] }

# Credential buffers that zero themselves on drop (M5 lock screen work, but the
# buffer type belongs with the state machine that owns it). MIT/Apache-2.0.
zeroize = "1"

# Project Fluent (ADR 0003, PRD §11.2): every user-visible string is a message
# in a catalog, so the loader lives in `inox-common::i18n`.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"

# The panel clock needs civil time in the session's timezone; the wallpaper and
# the launcher icon path need to decode PNG/JPEG.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- dev-dependencies ----------------------------------------------------
proptest = "1"
tempfile = "3"
serde_json = "1"
# The M3 end-to-end tests in `inox-integration` drive a real X11 client
# (`tests/support/x11_client.rs`). x11rb is the pure-Rust X11 client library
# (MIT/Apache-2.0), so the tests need no external X11 command line tools for
# their assertions. Its default feature set drives the `RustConnection`, which
# links no libxcb.
x11rb = "0.13"

[workspace.lints.rust]
# Root AGENTS.md §3.2. `inox-compositor` and `inox-xwayland` are the two
# crates allowed to narrow this to `deny` in their own manifest, because they
# hold the approved local `unsafe` glue.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Layer membership for ADR 0002. `crates/inox-integration/tests/layering.rs`
# reads this table, checks that it covers exactly the workspace members, and
# then enforces the dependency-direction rules. Adding a crate without giving
# it a layer here fails CI rather than escaping the rules.
[workspace.metadata.inox.layers]
l1 = ["inox-common", "inox-config"]
l2 = ["inox-protocols", "inox-compositor", "inox-xwayland"]
l3 = [
    "inox-shell",
    "inox-panel",
    "inox-launcher",
    "inox-notifications",
    "inox-settings",
    "inox-lock",
    "inox-wallpaper",
]
l4 = ["inox-session", "inox-idle", "inox-greet"]
test = ["inox-integration"]

[workspace.metadata.inox.rules]
# ADR 0002 rule 3: no Rust dependency may cross this boundary in either
# direction — the compositor and the shell talk over Wayland / inox-ipc / D-Bus.
decoupled = [["inox-compositor", "inox-shell"]]

# ADR 0002 rule 6: the only L3 crate permitted to depend on `inox-compositor`.
# ADR 0013 proposes removing this exception; delete the entry when it is
# accepted, and the check starts enforcing the stricter rule.
l3_dependencies_on_compositor = ["inox-wallpaper"]

# ADR 0002 rule 1 forbids same-layer edges, but `inox-config` depends on
# `inox-common` by design (PRD §3.1): L1 has an internal order that a four-rank
# layer model cannot express. The ADR index already tracks this ambiguity, and
# the check enforces rule 1 as written, so the dependency is recorded here as a
# machine-visible exception instead of being left implicit. Resolving it — by
# amending rule 1 for intra-layer ordering, or by restating the leaf rule —
# needs an ADR. Removing the entry turns CI red.
#
# `inox-compositor -> inox-protocols` (L2 -> L2) is the second entry, and it is
# no longer hypothetical: the compositor consumes the protocol bindings
# (`wl_*` plus the private `inox-ipc`) as of its merged "consume inox-protocols"
# work. Rule 1 forbids it as written, so it is recorded here rather than left to
# the reader. Settling rule 1 for intra-layer ordering is now blocking, not
# optional.
#
# The shell family is the third place this will bite: PRD §3.1 lists
# `inox-panel` and friends as depending on `inox-shell` (L3 -> L3). Nothing does
# yet, so nothing is listed; adding those edges needs an ADR and an entry here.
same_layer_exceptions = [["inox-config", "inox-common"], ["inox-compositor", "inox-protocols"]]
