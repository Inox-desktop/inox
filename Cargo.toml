# Inox desktop — cargo workspace root.
#
# the single-repository workspace replaced the multi-repository strategy with this single
# workspace. Every component is a member under `crates/`; the layer table in
# `[workspace.metadata.inox]` is the single source of truth for the L1–L4
# layering of the layering rules, and `crates/inox-integration/tests/layering.rs` asserts
# the dependency-direction rules against it on every CI run.
#
# `inox-docs` (the mdBook in `docs/book/`) is deliberately not a member: it has
# no `Cargo.toml`, takes part in no dependency graph, and is excluded from
# `cargo deny` (see root AGENTS.md §2).

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
# One version for the whole workspace. Independent per-crate SemVer was the
# compatibility matrix this ADR removed; a single release line replaces it.
#
# `0.1.1` and not `0.2.0`: `inox-common`'s live release line is `v0.1.1`, and
# main's `compat.toml` records that `v0.2.0` was re-cut to it and the old tag is
# retired (the `paths` addition is a compatible change, which is a patch under
# 0.x per the real backend 版本号语义与发布流程, still `proposed`). Taking 0.2.0 would
# reuse a retired number. If that ADR is rejected or changes the MSRV rule
# (this migration raises MSRV to 1.86 for eleven crates), this is the one line
# to revisit.
version = "0.1.1"
edition = "2024"
# zbus 6 folds the retired zvariant/zbus_names crates into its maintained API
# and requires Rust 1.89. Members inherit this single workspace floor.
rust-version = "1.89"
license = "LGPL-3.0"
repository = "https://github.com/Inox-desktop/inox"
readme = "README.md"
keywords = ["wayland", "desktop", "inox"]
categories = ["desktop"]

[workspace.dependencies]
# --- workspace-internal crates (path dependencies; never a git tag) -------
# The explicit `version` keeps `deny.toml`'s `[bans] wildcards = "deny"`
# satisfied: a path dependency without one carries an implicit `*`.
inox-common = { path = "crates/inox-common", version = "0.1" }
inox-config = { path = "crates/inox-config", version = "0.1" }
inox-protocols = { path = "crates/inox-protocols", version = "0.1" }
# The shared liquid-glass material API and QML component library (ADR 0040). It is
# L3, but it depends only downwards (`inox-config` L1, `inox-protocols` L2 and
# `wayland-client`), so consumers name it like any other path dependency. The
# `inox-panel -> inox-glass` edge is the same-layer exception recorded below.
inox-glass = { path = "crates/inox-glass", version = "0.1" }
# the authentication boundary. `default-features = false` is the point, not a detail: it is how the
# login *screen* gets the `auth-v1` contract without linking `libpam` or carrying
# the code that can start a session. The privileged half is enabled by this
# crate's own `default = ["server"]` when the helper is built, and a consumer that
# needs it says so explicitly.
inox-auth = { path = "crates/inox-auth", version = "0.1", default-features = false }

# --- third-party: one version for the whole graph -------------------------
anyhow = "1"
calloop = { version = "0.14", features = ["signals"] }
# The keyboard path on the session-lock surface: `wl_keyboard` hands the client an
# XKB keymap, and reading it by hand would mean reimplementing XKB — which on any
# layout but US produces the wrong character, silently. Already in the graph through
# smithay (the compositor links the same system library). The `wayland` feature is
# deliberately off: it exists for `Keymap::new_from_fd`, which is an `unsafe fn`,
# and Inox-authored code stays unsafe-free — the lock screen reads the keymap text
# through a bounded `String` instead.
xkbcommon = { version = "0.8", default-features = false }
rustix = { version = "1", features = ["process"] }
thiserror = "2"
# wayland-scanner emits `bitflags!` for a `bitfield="true"` protocol enum
# (`inox-glass-v1` v2's refraction flags). wayland-rs already pulls the
# same 2.x line in, so this adds no new version to the graph.
bitflags = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# --- the authentication boundary  -------------------------------
# `pam` is the safe wrapper around libpam; 0.8 is the first version that exposes
# the PAM return code, which is what lets a broken authenticator be told apart
# from a wrong password (`crates/inox-auth/src/pam.rs`). Its licence is
# MIT OR Apache-2.0, and its `pam-sys` dependency is pinned at 1.0.0-alpha5 by
# Cargo.lock; both are recorded in the authentication boundary.
pam = "0.8"
# Account lookup for the uid, gid and home a session is started with.
#
# `users` is here only because `pam` 0.8 needs it internally, and the three
# RUSTSEC advisories against it are ignored in `deny.toml` with that reasoning:
# the calls this workspace makes (`get_user_by_name`) are not the affected ones,
# and the group listing it *is* affected in is not used at all — `nix` below
# replaces it for that job. See the authentication boundary
users = "0.10"
# Supplementary groups for the session: `getgrouplist` with correct buffer
# sizing (it respects the count the kernel returns, which is exactly what
# RUSTSEC-2025-0040 is about). `nix` is already in the graph through `calloop`.
nix = { version = "0.31", features = ["user"] }

serde = { version = "1", features = ["derive"] }
serde_path_to_error = "0.1"
toml = "0.8"
toml_edit = "0.22"

wayland-backend = "0.3"
wayland-client = "0.31"
wayland-server = "0.31"
wayland-scanner = "0.31"
wayland-protocols = "0.32"
wayland-protocols-misc = { version = "0.3", features = ["client", "server"] }
wayland-protocols-wlr = { version = "0.3", features = ["client", "server"] }

smithay = { version = "0.7.0", default-features = false, features = [
    "desktop",
    "renderer_gl",
    "wayland_frontend",
    # Real backend: session ownership via libseat, DRM/KMS output,
    # GBM render target, udev-enumerated libinput devices.
    "backend_drm",
    "backend_gbm",
    "backend_libinput",
    "backend_udev",
    "backend_session",
    "backend_session_libseat",
] }

# --- L3 shell stack: QML + Qt Quick  -------
# The L3 shell components are QML + Qt Quick bound into Rust through cxx-qt;
# the Iced entries (iced, iced_layershell, iced_core, iced_runtime,
# iced_tiny_skia) are gone from the graph as of the completed migration
# . The Qt side is declared below.

# Credential buffers that zero themselves on drop (M5 lock screen work, but the
# buffer type belongs with the state machine that owns it). MIT/Apache-2.0.
zeroize = "1"

# --- QML + Qt Quick binding  -------------------------
# The L3 shell was migrated from Iced to QML + Qt Quick,
# bound into Rust through cxx-qt (KDAB, MIT OR Apache-2.0). cxx-qt is the Rust→QML bridge selected in
# the cxx-qt binding: a `#[cxx_qt::bridge]` module defines a Rust QObject exposed to QML
# as a normal QObject, with cxx-qt generating the C++ glue. The workspace keeps
# the LGPL route clean: only LGPL/permissive modules are pulled (never GPL-only
# Qt Wayland Compositor / Virtual Keyboard / QML Compiler — enforced by the
# `license-audit` CI job, the QML evaluation/0034).
#
# `cxx` is the underlying FFI layer cxx-qt builds on, `cxx-qt-lib` wraps the Qt
# core value types (QString, QColor, …) and owns the `full` feature that pulls
# the Qt modules cxx-qt-build links. `cxx-qt-build` is the build-script helper
# that resolves Qt through pkg-config and registers the QML module.
cxx = "1.0"
cxx-qt = "0.10.0"
cxx-qt-lib = { version = "0.10.0", features = ["full"] }
cxx-qt-build = "0.10.0"
# The build-script helper behind `cxx-qt-build`; named directly by a crate that
# needs `QResourceFile` (not re-exported by cxx-qt-build) to give QML resources
# an explicit alias. Same 0.10.0 `cxx-qt-build` already resolves.
qt-build-utils = "0.10.0"

# The notification daemon is the process behind `org.freedesktop.Notifications`,
# so it needs a real D-Bus client and server (M5, acceptance D06). zbus is the
# pure-Rust implementation: no `libdbus` system library, no FFI, no `unsafe` of
# ours. Transport threads drive its async API through `zbus::block_on`; Iced
# state remains on the application thread.
#
# zbus 6 has an async API driven by `block_on` on the transport threads.
# Keep the default runtime, proxies, services and tracing explicit; p2p is used
# by the real socket-pair tests without requiring a session bus.
zbus = { version = "6.0", default-features = false, features = [
    "default-rt",
    "proxy",
    "service",
    "p2p",
    "tracing",
] }

# Project Fluent: every user-visible string is a message
# in a catalog, so the loader lives in `inox-common::i18n`.
fluent-bundle = "0.16"
fluent-syntax = "0.12"
unic-langid = "0.9"

# The panel clock needs civil time in the session's timezone; the wallpaper and
# the launcher icon path need to decode PNG/JPEG.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

# --- dev-dependencies ----------------------------------------------------
proptest = "1"
tempfile = "3"
serde_json = "1"
# The M3 end-to-end tests in `inox-integration` drive a real X11 client
# (`tests/support/x11_client.rs`). x11rb is the pure-Rust X11 client library
# (MIT/Apache-2.0), so the tests need no external X11 command line tools for
# their assertions. Its default feature set drives the `RustConnection`, which
# links no libxcb.
x11rb = "0.13"

[workspace.lints.rust]
# Root AGENTS.md §3.2. `inox-compositor` and `inox-xwayland` are the two
# crates allowed to narrow this to `deny` in their own manifest, because they
# hold the approved local `unsafe` glue.
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = "warn"

# Layer membership for the layering rules. `crates/inox-integration/tests/layering.rs`
# reads this table, checks that it covers exactly the workspace members, and
# then enforces the dependency-direction rules. Adding a crate without giving
# it a layer here fails CI rather than escaping the rules.
[workspace.metadata.inox.layers]
l1 = ["inox-common", "inox-config"]
l2 = ["inox-protocols", "inox-compositor", "inox-xwayland", "inox-auth"]
l3 = [
    "inox-shell",
    "inox-panel",
    "inox-launcher",
    "inox-notifications",
    "inox-settings",
    "inox-lock",
    "inox-wallpaper",
    # the QML evaluation/0035: the QML + Qt Quick migration prototype. Zero internal
    # dependency (its only deps are cxx-qt/cxx-qt-lib and the L1 trivia), placed
    # at L3 where the future QML host components sit so the layering test and
    # the CI matrix cover it like any other shard.
    "inox-qml-prototype",
    # ADR 0040: the shared glass material API and the QML component library. L3
    # because its consumers are L3 components; the crate itself only depends
    # downwards, and the one incoming L3 edge is recorded in
    # `same_layer_exceptions` below.
    "inox-glass",
]
l4 = ["inox-session", "inox-idle", "inox-greet", "inox-host"]
test = ["inox-integration"]

[workspace.metadata.inox.rules]
# layering rule 3: no Rust dependency may cross this boundary in either
# direction — the compositor and the shell talk over Wayland / inox-ipc / D-Bus.
decoupled = [["inox-compositor", "inox-shell"]]

# layering rule 6: the only L3 crate permitted to depend on `inox-compositor`.
# the interaction contract proposes removing this exception; delete the entry when it is
# accepted, and the check starts enforcing the stricter rule.
l3_dependencies_on_compositor = ["inox-wallpaper"]

# layering rule 1 forbids same-layer edges, but `inox-config` depends on
# `inox-common` by design (PRD §3.1): L1 has an internal order that a four-rank
# layer model cannot express. The decision index already tracks this ambiguity, and
# the check enforces rule 1 as written, so the dependency is recorded here as a
# machine-visible exception instead of being left implicit. Resolving it — by
# amending rule 1 for intra-layer ordering, or by restating the leaf rule —
# needs an ADR. Removing the entry turns CI red.
#
# `inox-compositor -> inox-protocols` (L2 -> L2) is the second entry, and it is
# no longer hypothetical: the compositor consumes the protocol bindings
# (`wl_*` plus the private `inox-ipc`) as of its merged "consume inox-protocols"
# work. Rule 1 forbids it as written, so it is recorded here rather than left to
# the reader. Settling rule 1 for intra-layer ordering is now blocking, not
# optional.
#
# `inox-panel -> inox-glass` (L3 -> L3) is the third entry, and ADR 0040
# authorised it explicitly ("分层例外"): the panel and every later L3 component
# share one material API and one QML component library instead of each copying
# the clamp/fallback decisions, which is how `inox-panel/src/frost.rs` came to be
# the only implementation. `inox-glass` itself depends only downwards, so this is
# a star with one centre, not a web of L3 edges.
#
# `inox-notifications -> inox-glass` (L3 -> L3) is the fourth entry, authorised by
# ADR 0044, which extends 0040's component library to its second consumer. The
# notification stack is one of the three surfaces ui-guidelines §12 permits glass
# on, and its cards are an外壳 floating over the user's windows; drawing the
# tint/highlight/shade a second time in the notifications crate is exactly the
# drift ADR 0040 sunk `inox-glass` to prevent. The edge is **build-time only** —
# `inox-notifications` takes `inox-glass` as a build-dependency so its `build.rs`
# can compile the QML components into its own module (KDAB/cxx-qt#770) — and it
# adds no run-time Rust dependency. Deleting it means deleting this entry too.
#
# The shell family is a fourth place this will bite: PRD §3.1 lists
# `inox-panel` and friends as depending on `inox-shell` (L3 -> L3). Nothing does
# yet, so nothing is listed; adding those edges needs its own ADR and entry here.
same_layer_exceptions = [
    ["inox-config", "inox-common"],
    ["inox-compositor", "inox-protocols"],
    ["inox-panel", "inox-glass"],
    ["inox-notifications", "inox-glass"],
]

# --- release profile -------------------------------------------------------
#
# The release profile is part of the artifact contract, not a local preference:
# `cargo build --release` is what `packaging/package.sh` ships, so anything set
# here is what a tester runs.
#
# `strip = "symbols"` is why the canary tarball is tens of megabytes instead of
# hundreds: these are twelve binaries linked against Qt and Mesa. Debugging a
# tester's crash still works from the commit in BUILD-INFO (rebuild that commit
# and the symbols come back); symbols cannot be recovered from a stripped binary,
# which is the accepted cost.
#
# No LTO: the workspace is large, every PR would pay minutes for it, and the
# desktop is nowhere near a performance milestone — P01-P05 have no measurements
# at all (docs/quality/acceptance.md §10). Revisit when a performance budget
# exists and there is a number to defend.
[profile.release]
strip = "symbols"
